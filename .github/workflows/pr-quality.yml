name: PR Quality Gate

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run test suite
        run: npm test

      - name: Resolve runtime smoke freshness policy
        id: smoke_policy
        env:
          MAX_AGE_DAYS: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') && '30' || '14' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
        run: |
          echo "max_age_days=${MAX_AGE_DAYS}" >> "$GITHUB_OUTPUT"
          echo "pr_labels=${PR_LABELS}" >> "$GITHUB_OUTPUT"

      - name: Validate Unity runtime smoke liveops report
        run: |
          npm run check:unity-liveops -- \
            --input docs/runtime-smoke/runtime-smoke-report.device.json \
            --output artifacts/unity/runtime-smoke-liveops-check.pr.json \
            --max-age-days ${{ steps.smoke_policy.outputs.max_age_days }} \
            --strict

      - name: Publish runtime smoke gate summary
        if: always()
        run: |
          {
            echo "### Runtime Smoke Gate"
            echo "- labels: ${{ steps.smoke_policy.outputs.pr_labels }}"
            echo "- max-age-days: ${{ steps.smoke_policy.outputs.max_age_days }}"
            echo "- check artifact: artifacts/unity/runtime-smoke-liveops-check.pr.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert hotfix policy comment
        if: contains(github.event.pull_request.labels.*.name, 'hotfix') && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          MAX_AGE_DAYS: ${{ steps.smoke_policy.outputs.max_age_days }}
          SMOKE_CHECK_PATH: artifacts/unity/runtime-smoke-liveops-check.pr.json
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hotfix-policy-note -->';
            const maxAgeDays = process.env.MAX_AGE_DAYS || '30';
            const checkPath = process.env.SMOKE_CHECK_PATH || 'artifacts/unity/runtime-smoke-liveops-check.pr.json';

            let generatedAt = 'unknown';
            let reportAgeDays = 'unknown';
            let gatePassed = 'unknown';
            let failedChecks = 'unknown';

            try {
              const raw = fs.readFileSync(checkPath, 'utf8');
              const parsed = JSON.parse(raw);
              generatedAt = parsed?.extracted?.source_report_generated_at ?? 'unknown';
              reportAgeDays = parsed?.extracted?.report_age_days ?? 'unknown';
              gatePassed = parsed?.passed === true ? 'pass' : 'fail';
              failedChecks = parsed?.summary?.failed_checks ?? 'unknown';
            } catch (error) {
              core.warning(`Failed to read smoke check report at ${checkPath}: ${error.message}`);
            }

            const body = [
              marker,
              'Hotfix label detected. Runtime smoke freshness policy is relaxed for this PR:',
              '',
              `- Applied policy: \`max-age-days=${maxAgeDays}\``,
              '- Default policy (non-hotfix): `max-age-days=14`',
              `- Source report generated_at: \`${generatedAt}\``,
              `- Source report age_days: \`${reportAgeDays}\``,
              `- Smoke liveops gate result: \`${gatePassed}\` (failed_checks=${failedChecks})`,
              '',
              'This change only affects runtime smoke report freshness tolerance; all other quality gates remain required.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              typeof comment.body === 'string' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated hotfix policy comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              core.info(`Created hotfix policy comment: ${created.data.id}`);
            }

      - name: Upload liveops check artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-liveops-check
          path: artifacts/unity/runtime-smoke-liveops-check.pr.json
